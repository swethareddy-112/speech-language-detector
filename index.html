```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Language Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <h1>🎤 Speech Language Detector</h1>
            <p class="subtitle">Speak and detect the selected speech language</p>

            <div class="language-box">
                <label for="language">Select Language</label>
                <select id="language">
                    <option value="en-IN">English</option>
                    <option value="ta-IN">Tamil</option>
                    <option value="te-IN">Telugu</option>
                    <option value="hi-IN">Hindi</option>
                    <option value="ml-IN">Malayalam</option>
                    <option value="kn-IN">Kannada</option>
                    <option value="bn-IN">Bengali</option>
                </select>
            </div>

            <button id="startBtn">🎙️ Start Speaking</button>
            <button id="stopBtn" class="stop">⏹️ Stop</button>

            <div class="status" id="status">
                Click "Start Speaking" and speak clearly.
            </div>

            <div class="result">
                <h2>Detected Language</h2>
                <div id="detectedLanguage">---</div>
            </div>

            <div class="transcript">
                <h2>📝 Speech Text</h2>
                <p id="transcript">Your speech will appear here...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
```
